<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b63ce"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tu Destino Taxi"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Tu Destino Taxi</title></head><body><header><div class="logo">🚕</div><div><h1>Tu Destino Taxi</h1><small>Tu viaje, a tu destino.</small></div></header><main><div class="switch"><button id="passengerBtn" class="active">Pasajero</button><button id="driverBtn">Conductor</button></div><section id="passenger"><div class="card"><h2>¿A dónde vas?</h2><input id="destination" placeholder="Escribe tu destino"><div class="map">📍<span>Mapa de tu viaje</span></div><div class="fares"><button data-fare="150">Económico<br><b>RD$150</b></button><button data-fare="200" class="selected">Confort<br><b>RD$200</b></button><button data-fare="300">Premium<br><b>RD$300</b></button></div><button id="request" class="primary">🚕 Solicitar taxi</button><p id="status" class="status"></p></div><div class="card"><h3>Mis viajes</h3><div id="history">No hay viajes todavía.</div></div></section><section id="driver" hidden><div class="card"><h2>Modo conductor</h2><div class="online"><span id="dot">●</span><b id="onlineText">Desconectado</b><button id="toggleOnline">Conectarme</button></div><div id="driverRequest" class="requestBox" hidden><b>Nueva solicitud</b><p id="driverDest">Destino</p><p>Tarifa: RD$200</p><button id="accept" class="primary">Aceptar viaje</button><button id="reject" class="secondary">Rechazar</button></div><div class="map">🚕<span>Zona de trabajo</span></div></div></section></main><footer>Tu Destino Taxi · Versión inicial</footer><script src="app.js"></script></body></html>
